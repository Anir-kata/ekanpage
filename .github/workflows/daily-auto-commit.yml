name: Ekanpage Project Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  project-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Anir-kata"
          git config user.email "ekanir52@gmail.com"

      - name: Update project status log
        run: |
          mkdir -p .automation
          DATE_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          VERSION=$(node -p "require('./package.json').version")
          cat >> .automation/daily-log.txt <<EOF

---
Project: ekanpage
Version: ${VERSION}
Updated: ${DATE_UTC}
Status: active
Notes: Automated project status sync.
---
EOF

      - name: Commit project sync changes
        run: |
          git add .automation/daily-log.txt
          if git diff --cached --quiet; then
            echo "No project sync update required."
            exit 0
          fi
          DATE_TAG=$(date -u +'%Y-%m-%d')
          git commit -m "ekanpage: project sync ${DATE_TAG}"
          git push origin HEAD
