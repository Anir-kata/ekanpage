name: Daily Project Update

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  daily-project-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Anir-kata"
          git config user.email "ekanir52@gmail.com"

      - name: Update project journal
        run: |
          mkdir -p .automation
          DATE_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '# Ekanpage — Daily Project Journal'
            echo
            echo "- Project: Ekanpage"
            echo "- Version: ${VERSION}"
            echo "- Date: ${DATE_UTC}"
            echo '- Status: Active'
            echo
            echo '## Commits completed'
            echo '- CI fix for the NestJS bootstrap CORS test'
            echo '- GitHub Actions workflow cleanup and naming alignment'
            echo '- Project journal initialization for daily status tracking'
            echo
            echo '## Changes made today'
            echo '- Corrected backend test expectations to match the real dynamic CORS configuration'
            echo '- Standardized the workflow naming for professional project tracking'
            echo '- Added a dedicated journal file under .automation to keep daily updates traceable'
            echo
            echo '## Notes'
            echo '- Backend verification remains in good standing after the fix'
            echo '- Next focus: validate the workflow execution in GitHub Actions and continue project readiness checks'
            echo '---'
            echo
          } >> .automation/project-daily-log.md

      - name: Commit daily project update
        run: |
          git add .automation/project-daily-log.md
          if git diff --cached --quiet; then
            echo "No project update required."
            exit 0
          fi
          DATE_TAG=$(date -u +'%Y-%m-%d')
          git commit -m "ekanpage: daily project update ${DATE_TAG}"
          git push origin HEAD
