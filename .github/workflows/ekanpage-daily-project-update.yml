name: Ekanpage Daily Project Update

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  daily-project-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Anir-kata"
          git config user.email "ekanir52@gmail.com"

      - name: Update project journal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automation
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          TIME_LABEL="$(date -u +'%H:%M UTC')"
          VERSION="$(node -p "require('./package.json').version")"
          LOG_FILE=".automation/project-daily-log.md"

          if [ ! -f "$LOG_FILE" ]; then
            {
              printf '# Ekanpage — Daily Project Journal\n\n'
              printf -- '- Project: Ekanpage\n'
              printf -- '- Version: %s\n' "$VERSION"
              printf -- '- Date: %s\n' "$DATE_UTC"
              printf -- '- Status: Active\n'
              printf -- '- Cadence: 5 checkpoints per day\n\n'
              printf '## Commits completed\n'
              printf -- '- Workflow cadence aligned to five project updates per day\n'
              printf -- '- Daily operational journal established for project visibility\n'
              printf -- '- Project continuity tracked through structured checkpoint logging\n\n'
              printf '## Changes made today\n'
              printf -- '- Maintained the Ekanpage project journal with structured progress checks\n'
              printf -- '- Aligned automation with a professional daily delivery rhythm\n'
              printf -- '- Prepared the repository for continuous status visibility\n\n'
              printf '## Notes\n'
              printf -- '- The project is following a disciplined operational cadence\n'
              printf -- '- Next focus: validate all automated checkpoints on GitHub and maintain project continuity\n'
              printf -- '---\n\n'
            } > "$LOG_FILE"
          fi

          CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only --cached 2>/dev/null || true)"
          CHANGED_ITEMS=()
          if [ -n "$CHANGED_FILES" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && CHANGED_ITEMS+=("- $file")
            done <<< "$CHANGED_FILES"
          else
            CHANGED_ITEMS+=("- No source files changed in this update window.")
          fi

          UNCHANGED_ITEMS=()
          for area in "backend/src" "frontend/src" ".github/workflows" ".automation" "package.json"; do
            if ! printf '%s\n' "$CHANGED_FILES" | grep -Fq "$area"; then
              case "$area" in
                "backend/src") UNCHANGED_ITEMS+=("- Backend application source: not changed in this cycle.") ;;
                "frontend/src") UNCHANGED_ITEMS+=("- Frontend application source: not changed in this cycle.") ;;
                ".github/workflows") UNCHANGED_ITEMS+=("- GitHub workflow configuration: not changed in this cycle.") ;;
                ".automation") UNCHANGED_ITEMS+=("- Project journal automation: not changed in this cycle.") ;;
                "package.json") UNCHANGED_ITEMS+=("- Root package metadata: not changed in this cycle.") ;;
              esac
            fi
          done

          if [ ${#UNCHANGED_ITEMS[@]} -eq 0 ]; then
            UNCHANGED_ITEMS+=("- No major area remained unchanged in this update cycle.")
          fi

          {
            printf '## Checkpoint %s\n' "$TIME_LABEL"
            printf -- '- Review time: %s\n' "$DATE_UTC"
            printf -- '- Version: %s\n' "$VERSION"
            printf -- '- Status: Real update based on repository delta\n'
            printf -- '- Changed this cycle:\n'
            for item in "${CHANGED_ITEMS[@]}"; do
              printf -- '  %s\n' "$item"
            done
            printf -- '- Not changed this cycle:\n'
            for item in "${UNCHANGED_ITEMS[@]}"; do
              printf -- '  %s\n' "$item"
            done
            printf -- '- Outcome: the update reflects actual project changes and unchanged areas, rather than a static message.\n'
            printf -- '---\n\n'
          } >> "$LOG_FILE"

      - name: Commit daily project update
        shell: bash
        run: |
          set -euo pipefail
          git add .automation/project-daily-log.md
          if git diff --cached --quiet; then
            echo "No project update required."
            exit 0
          fi
          TIME_STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "5.1.30 workflow"
          git push origin HEAD:refs/heads/main
