name: Daily Project Update

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  daily-project-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Anir-kata"
          git config user.email "ekanir52@gmail.com"

      - name: Update project journal
        run: |
          mkdir -p .automation
          DATE_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          VERSION=$(node -p "require('./package.json').version")
          printf '%s\n' \
            '# Ekanpage — Daily Project Journal' \
            '' \
            '- Project: Ekanpage' \
            "- Version: ${VERSION}" \
            "- Date: ${DATE_UTC}" \
            '- Status: In progress' \
            '' \
            '## Commits completed' \
            '- [ ] describe the commit(s) completed today' \
            '- [ ] include the main feature, fix, or improvement' \
            '' \
            '## Changes made today' \
            '- [ ] summarize the work completed' \
            '- [ ] mention files or modules updated' \
            '- [ ] note any bug fixes or improvements' \
            '' \
            '## Notes' \
            '- [ ] add relevant project context' \
            '- [ ] mention next priority' > .automation/project-daily-log.md

      - name: Commit daily project update
        run: |
          git add .automation/project-daily-log.md
          if git diff --cached --quiet; then
            echo "No project update required."
            exit 0
          fi
          DATE_TAG=$(date -u +'%Y-%m-%d')
          git commit -m "ekanpage: daily project update ${DATE_TAG}"
          git push origin HEAD
